name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Migraciones + pruebas RLS en Postgres temporal
        run: bash supabase/tests/run.sh

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test --ci
      - name: Bundle Android (verifica que Metro compila la app)
        run: npx expo export --platform android --output-dir dist
        env:
          CI: 1
